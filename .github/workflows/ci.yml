name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, deploy]
  workflow_call: {}

jobs:
  backend:
    name: Backend build + test (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-dotnet/**/TestResults/**/*.trx

  admin-frontend:
    name: Admin frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      # Non-blocking: the inherited admin-frontend scaffold has ~50 pre-existing
      # no-explicit-any errors in pages slated for rewrite against the new backend
      # (see task "Adapt admin-frontend CRUD pages to new backend DTOs"). Surfacing
      # them here without blocking deploys on debt already scheduled to be paid down.
      - run: npm run lint
        continue-on-error: true
