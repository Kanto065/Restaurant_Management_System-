name: Deploy

on:
  push:
    branches: [deploy]

jobs:
  test:
    name: Run CI before deploying
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin deploy
            # `git switch` (not `checkout`) — the repo has a top-level deploy/ directory,
            # which makes `git checkout deploy` ambiguous between the branch and the path.
            git switch deploy
            git reset --hard origin/deploy
            cd deploy
            docker compose -f docker-compose.prod.yml up -d --build
            # caddy has no build context and its Caddyfile is bind-mounted, so `up -d --build`
            # never recreates it - a Caddyfile-only change (e.g. adding a proxy route) would
            # otherwise silently keep running the old config indefinitely. Reload picks up the
            # new file with no dropped connections; fall back to a full restart if that fails.
            docker compose -f docker-compose.prod.yml exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || docker compose -f docker-compose.prod.yml restart caddy
            docker image prune -f
