name: Deploy

on:
  push:
    branches: [deploy]

jobs:
  test:
    name: Run CI before deploying
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin deploy
            # `git switch` (not `checkout`) — the repo has a top-level deploy/ directory,
            # which makes `git checkout deploy` ambiguous between the branch and the path.
            git switch deploy
            git reset --hard origin/deploy
            cd deploy
            docker compose -f docker-compose.prod.yml up -d --build
            # caddy has no build context, so `up -d --build` never recreates it - and because its
            # Caddyfile is bind-mounted as a single file, `git reset --hard` replacing that file
            # with a new inode leaves the running container's mount pinned to the OLD inode
            # indefinitely. `caddy reload` does NOT fix this (it re-reads through the same stale
            # mount and "succeeds" against outdated config) - confirmed live: after adding a new
            # /uploads/* route, reload kept serving the pre-route config for hours until the
            # container was actually recreated. Only a real recreate re-resolves the bind mount.
            docker compose -f docker-compose.prod.yml up -d --force-recreate caddy
            docker image prune -f
