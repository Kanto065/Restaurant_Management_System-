name: Android POS release

on:
  push:
    branches: [main]
    paths: ["android/**"]
  workflow_dispatch: {}

# Lets softprops/action-gh-release create/update a release with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build and publish POS APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No gradlew is committed yet (Android Studio generates it locally on first sync) - this
      # provisions the exact Gradle version from android/gradle/wrapper/gradle-wrapper.properties
      # and runs `gradle` directly instead, with the same build-cache benefits `./gradlew` gives.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-scan-publish: false

      # versionName is now computed in build.gradle.kts as "0.1.<posBuildNumber>", so the run
      # number IS the version's patch digit - single source of truth, nothing to grep out of the
      # Gradle file and keep in sync by hand anymore.
      - name: Compute version
        id: version
        run: |
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=pos-v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      # Signed with the debug key committed at android/keystore/debug.keystore (see build.gradle.kts)
      # so every build shares one signature and installs cleanly as an update over the last one -
      # a debug key secures nothing, so committing it is fine; swap for a real release-signing
      # config (keystore + passwords as repo secrets) before this app goes any wider than our own
      # Sunmi terminals. POS_BUILD_NUMBER, baked into the APK via this, is what UpdateChecker
      # compares against releases' tag suffix to decide a newer build exists - must match
      # steps.version.outputs.tag above (both derive from GITHUB_RUN_NUMBER) or the in-app updater
      # would never fire.
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace -PposBuildNumber=${{ github.run_number }}

      - name: Rename APK to a stable filename
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/porttennanttandoori-pos.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: POS v${{ steps.version.outputs.name }}
          make_latest: true
          generate_release_notes: true
          files: release/porttennanttandoori-pos.apk

      # Second distribution point, alongside the GitHub release above: admin.porttennanttandoori.co.uk/download/pos
      # is a stable link staff can hand to whoever's setting up a new terminal, always serving
      # this exact build - the GitHub release history stays as the versioned archive.
      - name: Copy APK to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "release/porttennanttandoori-pos.apk"
          target: "/tmp/pos-release"
          strip_components: 1

      # Reuses the existing public-read "uploads" MinIO bucket (same one /uploads/* already
      # serves from) under a pos/ prefix, rather than provisioning a second bucket+policy - the
      # Caddyfile route below just proxies /download/pos straight to this fixed key. Pulls
      # MINIO_ROOT_USER/PASSWORD from the VPS's own deploy/.env instead of duplicating them as
      # GitHub secrets, via a one-shot minio/mc container on the compose stack's internal network
      # (MinIO itself has no port published to the internet - see docker-compose.prod.yml).
      - name: Publish APK to MinIO (admin download link)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}/deploy
            set -a; source .env; set +a
            # `mc alias set`'s ACCESS/SECRET are positional CLI args, and mc's global flag parser
            # pre-scans every arg for a leading "-" before dispatch (even past a "--" terminator) -
            # the generated MINIO_ROOT_PASSWORD on this VPS starts with "-", so that command always
            # got misread as an unknown flag. MC_HOST_<alias> defines the same alias from an env
            # var instead, so the secret never touches argv at all.
            docker run --rm --network platform_internal \
              -v /tmp/pos-release:/data:ro \
              -e MC_HOST_local="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000" \
              minio/mc:latest \
              cp /data/porttennanttandoori-pos.apk local/uploads/pos/porttennanttandoori-pos.apk
            rm -rf /tmp/pos-release
