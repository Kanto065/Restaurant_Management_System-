name: Android POS release

on:
  push:
    # Matches the rest of the pipeline: main is integration, deploy is "this is now released".
    # A POS build only gets published (GitHub release + VPS + MinIO) once android/** changes
    # actually land on deploy, not on every main push.
    branches: [deploy]
    paths: ["android/**"]
  workflow_dispatch: {}

# Lets softprops/action-gh-release create/update a release with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build and publish POS APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # versionName/versionCode are both derived from GITHUB_RUN_NUMBER, mirroring the archived
      # Kotlin app's scheme - the run number IS the version's patch digit, single source of
      # truth, and versionCode only ever goes up so every release installs as an update over the
      # last one.
      - name: Compute version
        id: version
        run: |
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=pos-v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: android
        run: flutter pub get

      # Signed with the debug key committed at android/android/app/keystore/debug.keystore (see
      # build.gradle.kts's debug signingConfig override) so every CI build shares one signature
      # and installs cleanly as an update over the last one - the same file and approach the
      # archived Kotlin app used (a debug key secures nothing, so committing it is fine; swap for
      # a real release-signing config before this app goes any wider than our own Sunmi
      # terminals).
      - name: Build release APK
        working-directory: android
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      # version.json rides alongside the APK in MinIO so the settings screen's "Check for
      # updates" can ask "is there a newer build" from our own server.
      - name: Rename APK to a stable filename
        run: |
          mkdir -p release
          cp android/build/app/outputs/flutter-apk/app-release.apk release/porttennanttandoori-pos.apk
          printf '{"buildNumber": %s, "versionName": "%s"}' \
            "${{ github.run_number }}" "${{ steps.version.outputs.name }}" > release/version.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: POS v${{ steps.version.outputs.name }}
          make_latest: true
          generate_release_notes: true
          files: release/porttennanttandoori-pos.apk

      # Second distribution point, alongside the GitHub release above: admin.porttennanttandoori.co.uk/download/pos
      # is a stable link staff can hand to whoever's setting up a new terminal, always serving
      # this exact build - the GitHub release history stays as the versioned archive. The admin
      # dashboard's sidebar/Devices page already link here (POS_APP_DOWNLOAD_URL); the Caddy
      # route proxying /download/pos to this MinIO object survived the Kotlin -> Flutter rewrite
      # untouched, so no admin-frontend change is needed.
      - name: Copy APK to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "release/porttennanttandoori-pos.apk,release/version.json"
          target: "/tmp/pos-release"
          strip_components: 1

      # Reuses the existing public-read "uploads" MinIO bucket under a pos/ prefix. Pulls
      # MINIO_ROOT_USER/PASSWORD from the VPS's own deploy/.env instead of duplicating them as
      # GitHub secrets, via a one-shot minio/mc container on the compose stack's internal network
      # (MinIO itself has no port published to the internet - see docker-compose.prod.yml).
      - name: Publish APK to MinIO (admin download link)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}/deploy
            set -a; source .env; set +a
            # `mc alias set`'s ACCESS/SECRET are positional CLI args, and mc's global flag parser
            # pre-scans every arg for a leading "-" before dispatch (even past a "--" terminator) -
            # the generated MINIO_ROOT_PASSWORD on this VPS starts with "-", so that command always
            # got misread as an unknown flag. MC_HOST_<alias> defines the same alias from an env
            # var instead, so the secret never touches argv at all.
            docker run --rm --network platform_internal \
              -v /tmp/pos-release:/data:ro \
              -e MC_HOST_local="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000" \
              minio/mc:latest \
              cp /data/porttennanttandoori-pos.apk local/uploads/pos/porttennanttandoori-pos.apk
            docker run --rm --network platform_internal \
              -v /tmp/pos-release:/data:ro \
              -e MC_HOST_local="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000" \
              minio/mc:latest \
              cp /data/version.json local/uploads/pos/version.json
            rm -rf /tmp/pos-release
