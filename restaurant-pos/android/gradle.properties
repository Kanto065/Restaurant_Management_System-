org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Old plugins compile Java for 1.8 while Kotlin defaults to 17; harmless on Android.
kotlin.jvm.target.validation.mode=warning
# Kotlin incremental compile crashes on Windows when the project (E:) and pub cache (C:) are on
# different drives (same fix as the Sunmi app in ../android).
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
