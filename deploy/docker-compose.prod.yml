name: platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    # Deliberately no "ports:" mapping — Postgres is reachable only from other
    # containers on the internal network, never from the host/public internet.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [internal]
    # No published ports — the S3 API (9000) is reached only via the api container (as an S3
    # client) and the Caddy /uploads/* proxy (as a public GET route, see Caddyfile); the admin
    # console (9001) is deliberately not exposed anywhere.

  api:
    build:
      context: ../backend-dotnet
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-platform};Username=${POSTGRES_USER:-platform};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__Host: ${SEED_HOST:-www.porttennanttandoori.co.uk}
      Seed__OwnerEmail: ${SEED_OWNER_EMAIL}
      Seed__OwnerPassword: ${SEED_OWNER_PASSWORD}
      Cors__AllowedOrigins__0: https://${SEED_HOST:-www.porttennanttandoori.co.uk}
      Cors__AllowedOrigins__1: https://${ADMIN_HOST}
      Storage__Provider: S3
      Storage__S3__ServiceUrl: http://minio:9000
      Storage__S3__AccessKey: ${MINIO_ROOT_USER}
      Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__S3__Bucket: uploads
    depends_on: [postgres, minio]
    networks: [internal]
    # No published ports — only reachable via the Caddy reverse proxy.
    # No Redis: realtime is now Server-Sent Events fanned out in-memory
    # (see SseConnectionManager) - fine for a single API replica. If this
    # ever runs multiple replicas, that in-memory fan-out needs a shared
    # backplane (Postgres LISTEN/NOTIFY is the natural fit) same as SignalR
    # would have needed Redis for.

  admin-frontend:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_HOST}
    restart: unless-stopped
    networks: [internal]

  storefront:
    build:
      context: ../storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    # No VITE_API_BASE_URL build arg - the storefront calls /api and /hubs on its
    # OWN origin (the tenant's branded domain), which Caddy splits to the api
    # container below. This keeps the Host header the tenant-resolution
    # middleware sees equal to the customer's actual domain.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/caddy-sites.d:/etc/caddy/sites.d:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_HOST: ${API_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      STOREFRONT_HOST: ${STOREFRONT_HOST}
      APEX_HOST: ${APEX_HOST}
      STOREFRONT_UAT_HOST: ${STOREFRONT_UAT_HOST}
      ADMIN_UAT_HOST: ${ADMIN_UAT_HOST}
      API_UAT_HOST: ${API_UAT_HOST}
      SUPERADMIN_HOST: ${SUPERADMIN_HOST:-superadmin.porttennanttandoori.co.uk}
      SUPERADMIN_UAT_HOST: ${SUPERADMIN_UAT_HOST:-superadminuat.porttennanttandoori.co.uk}
      # basic_auth in front of the super admin panels - Caddy refuses to start if a hash is
      # empty, so these MUST be in .env before deploying (hash via `caddy hash-password`).
      SUPERADMIN_BASIC_USER: ${SUPERADMIN_BASIC_USER:?set SUPERADMIN_BASIC_USER in .env}
      SUPERADMIN_BASIC_HASH: ${SUPERADMIN_BASIC_HASH:?set SUPERADMIN_BASIC_HASH in .env}
      # Star Spice (second tenant) - storefront, its admin, and their UAT copies.
      STARSPICE_HOST: ${STARSPICE_HOST:-starspicetumble.co.uk}
      STARSPICE_ADMIN_HOST: ${STARSPICE_ADMIN_HOST:-admin.starspicetumble.co.uk}
      STARSPICE_UAT_HOST: ${STARSPICE_UAT_HOST:-uat.starspicetumble.co.uk}
      STARSPICE_ADMIN_UAT_HOST: ${STARSPICE_ADMIN_UAT_HOST:-adminuat.starspicetumble.co.uk}
      # Password prompt in front of the Star Spice storefront until the client authorises launch.
      STARSPICE_PREVIEW_USER: ${STARSPICE_PREVIEW_USER:?set STARSPICE_PREVIEW_USER in .env}
      STARSPICE_PREVIEW_HASH: ${STARSPICE_PREVIEW_HASH:?set STARSPICE_PREVIEW_HASH in .env}
    depends_on: [api, admin-frontend, storefront, minio]
    # UAT's proxy-facing containers (see deploy/docker-compose.uat.yml) join this
    # SAME "internal" network directly - do not give Caddy a second network to
    # reach them instead. Confirmed live on this VPS: a container attached to
    # more than one Docker bridge network silently corrupts/strips certain
    # outbound HTTP response headers (Access-Control-*/Vary specifically, seen
    # both when Caddy itself was dual-homed and when an upstream container was)
    # - a host-level Docker/kernel networking quirk, not a Caddy or app bug.
    # Everything Caddy talks to must stay single-homed on "internal".
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  minio_data:
