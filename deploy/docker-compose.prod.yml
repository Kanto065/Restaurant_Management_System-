name: platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    # Deliberately no "ports:" mapping — Postgres is reachable only from other
    # containers on the internal network, never from the host/public internet.

  api:
    build:
      context: ../backend-dotnet
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-platform};Username=${POSTGRES_USER:-platform};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__Host: ${SEED_HOST:-www.porttennanttandoori.co.uk}
      Seed__OwnerEmail: ${SEED_OWNER_EMAIL}
      Seed__OwnerPassword: ${SEED_OWNER_PASSWORD}
      Cors__AllowedOrigins__0: https://${SEED_HOST:-www.porttennanttandoori.co.uk}
      Cors__AllowedOrigins__1: https://${ADMIN_HOST}
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on: [postgres]
    networks: [internal]
    # No published ports — only reachable via the Caddy reverse proxy.
    # No Redis: realtime is now Server-Sent Events fanned out in-memory
    # (see SseConnectionManager) - fine for a single API replica. If this
    # ever runs multiple replicas, that in-memory fan-out needs a shared
    # backplane (Postgres LISTEN/NOTIFY is the natural fit) same as SignalR
    # would have needed Redis for.

  admin-frontend:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_HOST}
    restart: unless-stopped
    networks: [internal]

  storefront:
    build:
      context: ../storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    # No VITE_API_BASE_URL build arg - the storefront calls /api and /hubs on its
    # OWN origin (the tenant's branded domain), which Caddy splits to the api
    # container below. This keeps the Host header the tenant-resolution
    # middleware sees equal to the customer's actual domain.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_HOST: ${API_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      STOREFRONT_HOST: ${STOREFRONT_HOST}
    depends_on: [api, admin-frontend, storefront]
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:
