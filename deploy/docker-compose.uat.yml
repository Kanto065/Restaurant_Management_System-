# Isolated UAT stack: own Postgres, own MinIO, own volumes - zero shared DATA
# with production. All services join prod's existing "internal" network
# directly (external, defined in docker-compose.prod.yml) rather than a
# separate network of their own or a dedicated "edge" network - confirmed live
# on this VPS that a container attached to more than one Docker bridge network
# silently corrupts/strips certain outbound HTTP response headers
# (Access-Control-*/Vary), a host-level Docker/kernel quirk. Every service here
# must stay single-homed. Service keys are prefixed uat-* (not just "postgres"/
# "minio"/etc) so Compose's automatic per-network DNS aliases don't collide
# with prod's plain "postgres"/"minio"/"api" aliases on that shared network.
name: platform-uat

services:
  uat-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: uat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform_uat}
      POSTGRES_USER: ${POSTGRES_USER:-platform_uat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - uat_postgres_data:/var/lib/postgresql/data
    networks: [internal]
    # No "ports:" - same as prod, Postgres is never reachable from the host/public internet.

  uat-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    container_name: uat-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - uat_minio_data:/data
    networks: [internal]

  uat-api:
    build:
      context: ../backend-dotnet
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: uat-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=uat-postgres;Port=5432;Database=${POSTGRES_DB:-platform_uat};Username=${POSTGRES_USER:-platform_uat};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__Host: ${SEED_HOST:-uat.porttennanttandoori.co.uk}
      Seed__OwnerEmail: ${SEED_OWNER_EMAIL}
      Seed__OwnerPassword: ${SEED_OWNER_PASSWORD}
      Cors__AllowedOrigins__0: https://${SEED_HOST:-uat.porttennanttandoori.co.uk}
      Cors__AllowedOrigins__1: https://${ADMIN_HOST}
      Storage__Provider: S3
      Storage__S3__ServiceUrl: http://uat-minio:9000
      Storage__S3__AccessKey: ${MINIO_ROOT_USER}
      Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__S3__Bucket: uploads
    depends_on: [uat-postgres, uat-minio]
    networks: [internal]

  uat-admin-frontend:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_HOST}
    restart: unless-stopped
    container_name: uat-admin-frontend
    networks: [internal]

  uat-storefront:
    build:
      context: ../storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: uat-storefront
    networks: [internal]
    # Same as prod - calls /api and /uploads on its own origin, so Caddy's
    # UAT storefront block can split traffic to uat-api/uat-minio while keeping
    # the Host header equal to uat.porttennanttandoori.co.uk for tenant resolution.

networks:
  internal:
    external: true
    name: platform_internal

volumes:
  uat_postgres_data:
  uat_minio_data:
